name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

# A newer push replaces a run still going for the same branch, which saves minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install clang-format
        run: sudo apt-get install -y clang-format-14

      - name: Check style
        run: |
          # Two older test files from Shotcut are not formatted, so tests are checked by name.
          find src tests/test_simple_*.cpp tests/test_collage.cpp -type f \( -name '*.h' -o -name '*.c' -o -name '*.cpp' \) \
            ! -path '*spatialmedia*' ! -name 'defaultlayouts.h' -print0 \
            | xargs -0 clang-format-14 --dry-run --Werror -style=file

  build-and-test:
    runs-on: ubuntu-24.04
    # The first run builds FFmpeg and MLT from source on 2 cores; later runs use the caches.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7

      # Qt, FFmpeg and MLT take a long time to build and rarely change.
      - name: Restore dependencies
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/Qt
            ~/ffmpeg9
            ~/mlt
          key: deps-${{ runner.os }}-${{ hashFiles('scripts/bugs/setup-dev-linux.sh') }}

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Set up dependencies and configure
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache
          scripts/bugs/setup-dev-linux.sh
          source scripts/bugs/env.sh
          cmake -B build/dev -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # Saved straight away, so a later failure does not throw away hours of building.
      - name: Save dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/Qt
            ~/ffmpeg9
            ~/mlt
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Build
        run: |
          source scripts/bugs/env.sh
          cmake --build build/dev

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}

      - name: Test
        run: |
          source scripts/bugs/env.sh
          Xvfb :99 -screen 0 1366x768x24 +extension GLX &
          sleep 1
          ctest --test-dir build/dev -R simple --output-on-failure
